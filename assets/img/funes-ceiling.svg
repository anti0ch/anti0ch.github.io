<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="Six eviction policies against a clairvoyant ceiling, at three budgets.">
<style>
  .bg { fill: #ffffff; }
